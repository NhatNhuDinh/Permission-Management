<div style="
  font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
  background-color: #f5f7fa;
  color: #333;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 45vh;
  width: 50em;
">
    <div style="
    background-color: #fff;
    padding: 2.5em 3em;
    border-radius: 12px;
    box-shadow: 0 12px 24px rgba(0,0,0,0.15);
    max-width: 480px;
    width: 100%;
    text-align: center;
  ">

        <!-- Icon lỗi -->
        <div style="font-size: 3.5em; color: #d32f2f; margin-bottom: 0.3em;">
            &#9888;
        </div>

        <!-- Tiêu đề -->
        <div style="
      font-size: 1.7em;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 0.3em;
    ">
            Lỗi xác thực
        </div>

        <!-- Thông điệp -->
        <div style="
      font-size: 1.1em;
      color: #555;
      line-height: 1.6;
      margin-bottom: 2em;
    ">
            ${message}
        </div>

        <!-- Nút đóng -->
        <a href="#"
           onclick="event.preventDefault(); document.dispatchEvent(new KeyboardEvent('keydown', {key: 'Escape'}));"
           style="
         display: inline-block;
         padding: 0.75em 2.5em;
         background: linear-gradient(135deg, #d32f2f, #b71c1c);
         color: #fff;
         border-radius: 8px;
         font-weight: 600;
         text-decoration: none;
         box-shadow: 0 4px 12px rgba(211, 47, 47, 0.4);
         transition: background 0.3s ease;
       "
           onmouseover="this.style.background='linear-gradient(135deg, #b71c1c, #a41818)'"
           onmouseout="this.style.background='linear-gradient(135deg, #d32f2f, #b71c1c)'"
        >
            Đóng
        </a>

    </div>
</div>
