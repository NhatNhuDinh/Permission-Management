<div style="
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f2f4f8;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 45vh;
">
    <div style="
        text-align: center;
    ">
        <div style="font-size: 1.8em; font-weight: 600; color: #d32f2f; margin-bottom: 12px;">
            Đã xảy ra lỗi hệ thống
        </div>
        <div style="font-size: 1.1em; color: #555; margin-bottom: 24px;">
            Vui lòng liên hệ quản trị viên để được hỗ trợ.
        </div>
        <a href="#"
           onclick="event.preventDefault(); document.dispatchEvent(new KeyboardEvent('keydown', {key: 'Escape'}));"
           style="
         display: inline-block;
         padding: 0.75em 2.5em;
         background: linear-gradient(135deg, #d32f2f, #b71c1c);
         color: #fff;
         border-radius: 8px;
         font-weight: 600;
         text-decoration: none;
         box-shadow: 0 4px 12px rgba(211, 47, 47, 0.4);
         transition: background 0.3s ease;
       "
           onmouseover="this.style.background='linear-gradient(135deg, #b71c1c, #a41818)'"
           onmouseout="this.style.background='linear-gradient(135deg, #d32f2f, #b71c1c)'"
        >
            Đóng
        </a>
    </div>
</div>
